<title>음성 발주</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F4F1EA;--paper:#fff;--ink:#1C211F;--muted:#6E746F;--line:#DDD6CA;--main:#14573F;--soft:#EEF5EF;--warn:#CF4D43;--yellow:#FFE45C}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh}
button,textarea,input{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--main);color:#fff;padding:11px 10px;box-shadow:0 2px 12px rgba(20,87,63,.16);display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:18px;font-weight:900;white-space:nowrap}.top-actions{display:flex;gap:4px}.top-copy{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 7px;font-size:12px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px 6px 0;background:var(--bg)}.tab{border:1px solid var(--line);background:#fff;color:var(--main);border-radius:9px;padding:9px;font-size:13px;font-weight:900}.tab.active{background:var(--main);color:#fff;border-color:var(--main)}.wrap{padding:8px 6px 96px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:7px}

%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:8px}.pick{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:10px 4px;font-size:14px;font-weight:900}

let orders=[];let userAliases={};let voiceLogs=[];const LS='voice_inventory_orders_v1';const ALIAS_LS='voice_inventory_aliases_v1';const LOG_LS='voice_inventory_logs_v1';
function cleanItemName(name){return String(name||'').replace(/\((냉동|냉장|상온|실온)\)/g,'').replace(/\s+/g,' ').trim();}
function phonetic(s){return String(s||'').toLowerCase().replace(/\((냉동|냉장|상온|실온)\)/g,'').replace(/\s+/g,'').replace(/온즈|온스/g,'oz').replace(/[^가-힣a-z0-9]/g,'').replace(/로터스/g,'로투스').replace(/비스코프|비스코프/g,'비스코프').replace(/원펙|원팩트|원팩/g,'원팩').replace(/딸끼|딸기/g,'딸기').replace(/골든키위|골드키위/g,'골드키위').replace(/키위쥬스|키위주스/g,'키위주스').replace(/망고다이즈/g,'망고다이스').replace(/오트밀크|오트밀크/g,'오트밀크').replace(/아몬드브리즈|아몬드브리스/g,'아몬드브리즈').replace(/디카페인|디카패인/g,'디카페인').replace(/우유|유유/g,'우유').replace(/원두|완두/g,'원두').replace(/스트로|스트로우/g,'스트로우').replace(/컵홀더|컵홀다/g,'컵홀더').replace(/돔뚜껑|돔두껑|돔뚜경/g,'돔뚜껑').replace(/피치프룬|피치푸른/g,'피치푸룬');}
function norm(s){return phonetic(s);}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const ITEMS=DEFAULT_ITEMS.map((x,idx)=>({id:idx,name:cleanItemName(x.name),raw:x.name,location:x.storage||'미지정',unit:String(x.unit||'EA').toUpperCase(),key:norm(x.name)}));
const ITEM_ALIASES={'원두':'원두','디카페인원두':'디카페인 원두','디카페인':'디카페인 원두','우유':'동원우유','동원우유':'동원우유','오트밀크':'오트밀크','아몬드브리즈':'아몬드브리즈','로투스':'로투스 비스코프','로터스':'로투스 비스코프','원팩딸기':'원팩딸기','딸기원팩':'원팩딸기','원팩골드키위':'원팩골드키위주스','골드키위':'원팩골드키위주스','원팩딸기바나나':'원팩딸기바나나주스','딸기바나나':'원팩딸기바나나주스','원팩피치푸룬':'원팩피치푸룬주스','피치푸룬':'원팩피치푸룬주스','32oz돔뚜껑':'아이스컵돔뚜껑(32o)z','32온즈돔뚜껑':'아이스컵돔뚜껑(32o)z','돔뚜껑32':'아이스컵돔뚜껑(32o)z'};
function load(){try{orders=JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){orders=[];}try{userAliases=JSON.parse(localStorage.getItem(ALIAS_LS)||'{}');}catch(e){userAliases={};}try{voiceLogs=JSON.parse(localStorage.getItem(LOG_LS)||'[]');}catch(e){voiceLogs=[];}render();renderVoiceLogs();}

function parseQty(text){const raw=String(text||'');const digit=raw.match(/(\d+)\s*(개|박스|팩|잔|ea|box|pak)/i);if(digit)return parseInt(digit[1],10);const compact=raw.replace(/\s+/g,'');const nums={'스물':20,'이십':20,'십구':19,'십팔':18,'십칠':17,'십육':16,'십오':15,'십사':14,'십삼':13,'십이':12,'십일':11,'열아홉':19,'열여덟':18,'열일곱':17,'열여섯':16,'열다섯':15,'열네':14,'열넷':14,'열세':13,'열셋':13,'열두':12,'열둘':12,'열한':11,'열하나':11,'열':10,'십':10,'아홉':9,'구':9,'여덟':8,'팔':8,'일곱':7,'칠':7,'여섯':6,'육':6,'다섯':5,'오':5,'네':4,'넷':4,'사':4,'세':3,'셋':3,'삼':3,'두':2,'둘':2,'이':2,'한':1,'하나':1,'일':1};for(const key of Object.keys(nums).sort((a,b)=>b.length-a.length)){if(compact.includes(key+'개')||compact.includes(key+'박스')||compact.includes(key+'팩')||compact.includes(key+'잔'))return nums[key];}return 0;}
function itemByName(name){const target=norm(name);return ITEMS.find(item=>item.key===target)||ITEMS.find(item=>item.key.includes(target));}
function bestMatch(name){const key=norm(name);if(!key)return null;if(userAliases[key])return ITEMS.find(item=>item.id===userAliases[key])||null;if(ITEM_ALIASES[key])return itemByName(ITEM_ALIASES[key]);const learnedKeys=Object.keys(userAliases).sort((a,b)=>b.length-a.length);for(const alias of learnedKeys){if(key.includes(alias))return ITEMS.find(item=>item.id===userAliases[alias])||null;}const aliasKeys=Object.keys(ITEM_ALIASES).sort((a,b)=>b.length-a.length);for(const alias of aliasKeys){if(key.includes(alias))return itemByName(ITEM_ALIASES[alias]);}let exact=ITEMS.find(item=>item.key===key);if(exact)return exact;let contained=ITEMS.filter(item=>item.key.includes(key)||key.includes(item.key)).sort((a,b)=>a.key.length-b.key.length);if(contained.length===1)return contained[0];if(contained.length>1){const shortest=contained[0];if(key.length>=3&&shortest.key.includes(key))return shortest;}return null;}
function nameFromLine(line){return String(line||'').replace(/\d+\s*(개|박스|팩|ea|box|pak)/ig,' ').replace(/(열아홉|열여덟|열일곱|열여섯|열다섯|열네|열넷|열세|열셋|열두|열둘|열한|열하나|십구|십팔|십칠|십육|십오|십사|십삼|십이|십일|하나|다섯|여섯|일곱|여덟|아홉|스물|이십|한|두|둘|세|셋|네|넷|열|십)\s*(개|박스|팩|잔)/g,' ').replace(/(세계|새개|세게|세요|이요|이오)$/g,' ').trim();}
function similarity(a,b){const aa=[...new Set(norm(a))],bb=norm(b);if(!aa.length||!bb)return 0;let hit=0;for(const ch of aa){if(bb.includes(ch))hit++;}return hit/Math.max(aa.length,Math.min(bb.length,aa.length+2));}
function candidateItems(name){const key=norm(name);if(!key)return [];const rows=[];for(const item of ITEMS){const aliases=aliasesFor(item);let score=0;for(const alias of aliases){if(alias===key)score=Math.max(score,100);else if(alias.includes(key)||key.includes(alias))score=Math.max(score,80-Math.abs(alias.length-key.length));else score=Math.max(score,Math.round(similarity(key,alias)*60));}if(score>=26)rows.push({item,score});}return rows.sort((a,b)=>b.score-a.score||a.item.name.length-b.item.name.length).slice(0,4).map(x=>x.item);}
function lineToOrder(line){const qty=parseQty(line);if(!qty)return {miss:line,reason:'수량 없음',qty:0,candidates:[]};const name=nameFromLine(line);const item=bestMatch(name);if(!item)return {miss:line,reason:'품목 못 찾음',qty,candidates:candidateItems(name)};return {item,qty};}
function aliasesFor(item){const a=[item.key];for(const [alias,id] of Object.entries(userAliases)){if(id===item.id)a.push(alias);}for(const [alias,name] of Object.entries(ITEM_ALIASES)){const target=itemByName(name);if(target&&target.id===item.id)a.push(alias);}return [...new Set(a.map(norm).filter(Boolean))];}
function extractOrdersFromLine(line){const key=norm(line);const hits=[];for(const item of ITEMS){for(const alias of aliasesFor(item)){const idx=key.indexOf(alias);if(idx>=0)hits.push({idx,len:alias.length,item,alias});}}hits.sort((a,b)=>a.idx-b.idx||b.len-a.len);const chosen=[];for(const hit of hits){if(!chosen.some(x=>hit.idx<x.idx+x.len&&x.idx<hit.idx+hit.len))chosen.push(hit);}if(chosen.length<2)return null;const out=[];for(let i=0;i<chosen.length;i++){const start=chosen[i].idx+chosen[i].len;const end=i+1<chosen.length?chosen[i+1].idx:key.length;const qty=parseQty(key.slice(start,end));if(qty)out.push({item:chosen[i].item,qty});else out.push({miss:chosen[i].item.name,reason:'수량 없음'});}return out;}
function applyText(text){addVoiceLog(text);const lines=[...new Set(String(text||'').split(/[\n,，]/).map(x=>x.trim()).filter(Boolean))];const misses=[];for(const line of lines){const multi=extractOrdersFromLine(line);if(multi){for(const parsed of multi){if(parsed.item)addOrSet(parsed.item,parsed.qty);else misses.push(parsed);}continue;}const parsed=lineToOrder(line);if(parsed.item){addOrSet(parsed.item,parsed.qty);}else misses.push(parsed);}render();renderMisses(misses);toast(misses.length?'확인 필요한 항목이 있어요':'자동 반영됐어요');}

function addOrSet(item,qty){const found=orders.find(x=>x.id===item.id);if(found)found.qty=String(qty);else orders.push({id:item.id,name:item.name,unit:item.unit,location:item.location,qty:String(qty)});save();}
function learnAlias(spoken,item){const alias=norm(nameFromLine(spoken));if(alias&&alias.length>=2){userAliases[alias]=item.id;saveAliases();}}
function safeQty(spoken,qty){const parsed=parseQty(spoken);return parsed||parseInt(qty,10)||1;}
function addCandidate(id,qty,spoken){const item=ITEMS.find(x=>x.id===id);if(!item)return;learnAlias(spoken,item);addOrSet(item,safeQty(spoken,qty));renderMisses([]);toast('선택한 품목을 기억했어요');}

function openAliasManager(){pendingAlias=null;document.querySelector('.sheet-title').textContent='별칭 관리';document.getElementById('aliasSearch').style.display='none';document.getElementById('aliasModal').classList.add('show');renderAliasManager();}
function closeAliasModal(){document.getElementById('aliasModal').classList.remove('show');pendingAlias=null;}
function renderAliasPicker(){const q=norm(document.getElementById('aliasSearch').value);const list=ITEMS.filter(item=>!q||item.key.includes(q)||similarity(q,item.key)>.35).slice(0,40);document.getElementById('aliasPicker').innerHTML=list.map(item=>'<button class="pick" onclick="selectAliasItem('+item.id+')">'+escapeHtml(item.name)+' · '+escapeHtml(item.unit)+'</button>').join('');}
function selectAliasItem(id){if(!pendingAlias)return;const item=ITEMS.find(x=>x.id===id);if(!item)return;learnAlias(pendingAlias.miss,item);addOrSet(item,safeQty(pendingAlias.miss,pendingAlias.qty));closeAliasModal();renderMisses([]);toast('별칭으로 기억했어요');}
function deleteAlias(idx){const alias=Object.keys(userAliases).sort()[idx];if(!alias)return;delete userAliases[alias];saveAliases();renderAliasManager();toast('별칭을 삭제했어요');}
function renderAliasManager(){const keys=Object.keys(userAliases).sort();document.getElementById('aliasPicker').innerHTML=keys.length?keys.map((alias,idx)=>{const item=ITEMS.find(x=>x.id===userAliases[alias]);return '<div class="pick">'+escapeHtml(alias)+' → '+escapeHtml(item?item.name:'삭제된 품목')+'<button class="del" style="float:right;display:inline-block" onclick="deleteAlias('+idx+')">×</button></div>';}).join(''):'<div class="empty">등록된 별칭이 없어요.</div>';}
function renderMisses(misses){document.getElementById('missBox').innerHTML=misses.length?'<div class="miss">확인 필요<br>'+misses.map((x,mi)=>{const buttons=(x.candidates||[]).map(c=>'<button class="mini" onclick="addCandidate('+c.id+','+(x.qty||1)+',window._misses['+mi+'].miss)">'+escapeHtml(c.name)+' '+(x.qty||1)+escapeHtml(c.unit)+'</button>').join('');const learn=x.qty?'<button class="learn" onclick="openAliasModal('+mi+')">별칭등록</button>':'';return '<div class="miss-line">- '+escapeHtml(x.miss)+' ('+x.reason+')</div>'+buttons+learn;}).join('')+'</div>':'';window._misses=misses;}
function render(){document.getElementById('resultList').innerHTML=orders.length?orders.map((o,i)=>'<div class="row"><div class="name">'+escapeHtml(o.name)+'</div><input class="qty" inputmode="numeric" value="'+escapeHtml(o.qty)+'" oninput="updateQty('+i+',this.value)"><div class="unit">'+escapeHtml(o.unit)+'</div><button class="del" onclick="delOrder('+i+')">×</button></div>').join(''):'<div class="empty">아직 발주 목록이 없어요.</div>';}
function showTab(tab){document.getElementById('orderView').style.display=tab==='order'?'block':'none';document.getElementById('logView').style.display=tab==='log'?'block':'none';document.getElementById('tabOrder').classList.toggle('active',tab==='order');document.getElementById('tabLog').classList.toggle('active',tab==='log');if(tab==='log')renderVoiceLogs();}
function addVoiceLog(text){const clean=String(text||'').trim();if(!clean)return;if(voiceLogs[0]&&voiceLogs[0].text===clean)return;voiceLogs.unshift({text:clean,time:new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});voiceLogs=voiceLogs.slice(0,100);saveLogs();renderVoiceLogs();}
function useLog(i){const log=voiceLogs[i];if(!log)return;document.getElementById('voiceText').value=log.text;showTab('order');toast('입력창으로 불러왔어요');}
function clearVoiceLogs(){if(!confirm('음성 기록을 비울까요?'))return;voiceLogs=[];saveLogs();renderVoiceLogs();}
function renderVoiceLogs(){const el=document.getElementById('voiceLogList');if(!el)return;el.innerHTML=voiceLogs.length?'<button class="outline" style="width:100%;margin-bottom:6px" onclick="clearVoiceLogs()">기록 비우기</button>'+voiceLogs.map((log,i)=>'<div class="log-row" onclick="useLog('+i+')"><div class="log-time">'+escapeHtml(log.time)+'</div><div class="log-text">'+escapeHtml(log.text)+'</div></div>').join(''):'<div class="empty">아직 음성 기록이 없어요.</div>';}
function updateQty(i,v){if(!orders[i])return;orders[i].qty=String(v).replace(/[^0-9]/g,'');save();}
function delOrder(i){orders.splice(i,1);save();render();}
function resetOrders(){if(!confirm('발주 목록을 비울까요?'))return;orders=[];save();render();toast('초기화했어요');}
async function copyOrders(){const rows=orders.filter(o=>String(o.qty||'').trim());const text=rows.length?rows.map(o=>o.name+' '+o.qty+' '+o.unit).join('\n'):'입력된 발주가 없습니다.';try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}toast('카톡에 붙여넣기 준비됐어요');}
function clearText(){document.getElementById('voiceText').value='';document.getElementById('missBox').innerHTML='';}
function appendExample(){document.getElementById('voiceText').value='원팩딸기 3개\n우유 2개\n로투스 1박스';}
function setVoiceStatus(msg){}
function voiceErrorMessage(error){return {not_allowed:'마이크 권한이 막혀 있어요. 주소창 왼쪽 자물쇠에서 마이크를 허용해주세요.',service_not_allowed:'브라우저 음성 서비스가 막혀 있어요. 크롬에서 https 주소로 다시 열어주세요.',no_speech:'말소리가 잡히지 않았어요. 버튼을 다시 누르고 조금 더 가까이 말해주세요.',audio_capture:'마이크를 찾지 못했어요. 휴대폰/브라우저 마이크 권한을 확인해주세요.',network:'음성 인식 서버 연결이 불안정해요. 인터넷 연결 후 다시 시도해주세요.',aborted:'음성 인식이 취소됐어요. 다시 말하기를 눌러주세요.'}[String(error||'').replace(/-/g,'_')]||'음성 인식이 중단됐어요. 휴대폰 키보드의 마이크로 받아쓴 뒤 자동 반영을 눌러도 됩니다.';}
let recognition=null;let isListening=false;
function setVoiceButtons(text,bg){document.querySelectorAll('.mic,.voice-big').forEach(btn=>{btn.textContent=text;btn.style.background=bg||'';});}
function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    // 브라우저 미지원 시 키보드 마이크로 안내
    const box=document.getElementById('voiceText');box.focus();
    setVoiceStatus('이 브라우저는 음성인식을 지원하지 않아요. 크롬(Chrome)을 사용하거나, 키보드 마이크 아이콘을 눌러 입력해주세요.');
    return;
  }
  if(isListening){recognition.stop();return;}
  recognition=new SpeechRecognition();
  recognition.lang='ko-KR';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  recognition.onstart=function(){
    isListening=true;
    setVoiceButtons('중지','var(--warn)');
    setVoiceStatus('🎙 짧게 한 번만 말해주세요. 예: 원팩딸기 세 개, 우유 두 개, 로투스 십오 박스');
  };
  recognition.onresult=function(e){
    const finalText=e.results[e.results.length-1][0].transcript.trim();
    const box=document.getElementById('voiceText');
    if(finalText){box.value=finalText;applyText(finalText);}
    setVoiceStatus('받아쓴 내용: '+finalText);
  };
  recognition.onerror=function(e){
    setVoiceStatus('⚠️ '+voiceErrorMessage(e.error));
    isListening=false;
    setVoiceButtons('음성입력','');
  };
  recognition.onend=function(){
    isListening=false;
    setVoiceButtons('음성입력','');
    setVoiceStatus('✅ 완료! 내용이 이상하면 지우고 다시 말해주세요. 맞으면 자동 반영을 누르세요.');
  };
  recognition.start();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1800);}
load();
</script>
</body>
