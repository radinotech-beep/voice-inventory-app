<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14573F">
<title>음성 발주</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F4F1EA;--paper:#fff;--ink:#1C211F;--muted:#6E746F;--line:#DDD6CA;--main:#14573F;--soft:#EEF5EF;--warn:#CF4D43;--yellow:#FFE45C}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh}
button,textarea,input{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--main);color:#fff;padding:13px 14px 11px;box-shadow:0 2px 12px rgba(20,87,63,.16)}
.title{font-size:19px;font-weight:900}.sub{font-size:11px;color:rgba(255,255,255,.78);margin-top:3px}.wrap{padding:10px 10px 96px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px}
.label{font-size:12px;font-weight:900;color:var(--main);margin-bottom:7px}.voice-row{display:grid;grid-template-columns:1fr 86px;gap:7px;margin-bottom:8px}.mic{border:none;background:var(--main);color:#fff;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:900;cursor:pointer}.clear{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:900;cursor:pointer}
textarea{width:100%;min-height:126px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;line-height:1.55;outline:none;resize:vertical;background:#fff}textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(20,87,63,.1)}.hint{font-size:11px;color:var(--muted);line-height:1.45;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions button{border-radius:10px;padding:12px 8px;font-size:14px;font-weight:900;cursor:pointer}.outline{border:1px solid var(--line);background:#fff;color:var(--ink)}.primary{border:none;background:var(--main);color:#fff}
.result-head{display:grid;grid-template-columns:1fr 64px 44px 42px;gap:5px;padding:0 4px 5px;font-size:10px;font-weight:900;color:var(--muted);text-align:center}.result-head div:first-child{text-align:left}.row{display:grid;grid-template-columns:1fr 64px 44px 42px;gap:5px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;margin-bottom:5px}.name{font-size:13px;font-weight:900;line-height:1.2;word-break:keep-all}.meta{font-size:10px;color:var(--muted);margin-top:2px}.qty{height:34px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:16px;font-weight:900;color:var(--warn);outline:none}.unit{font-size:11px;font-weight:900;text-align:center;color:var(--muted)}.del{height:32px;border:1px solid #F0C0B9;background:#FFF5F3;color:var(--warn);border-radius:7px;font-size:11px;font-weight:900;cursor:pointer}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.miss{background:#FFF9D8;border:1px solid #E8D36D;border-radius:9px;padding:8px;margin-top:8px;font-size:12px;line-height:1.5}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);padding:8px 10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;z-index:20}.bottom button{border-radius:10px;padding:13px 8px;font-size:14px;font-weight:900;cursor:pointer}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(28,33,31,.9);color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:900;z-index:50;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="title">음성 발주</div><div class="sub">말한 내용을 품목과 수량으로 자동 정리</div></header>
<main class="wrap">
  <section class="card"><div class="label">말로 입력</div><div class="voice-row"><button class="mic" onclick="startVoice()">말하기</button><button class="clear" onclick="clearText()">지우기</button></div><textarea id="voiceText" placeholder="예: 원팩딸기 3개
우유 2개
로투스 1박스"></textarea><div class="hint">휴대폰에서는 키보드 마이크로 받아써도 됩니다. 품목명 일부와 숫자만 말해도 최대한 찾아요.</div><div class="actions"><button class="outline" onclick="appendExample()">예시 넣기</button><button class="primary" onclick="parseVoiceText()">자동 반영</button></div><div id="missBox"></div></section>
  <section class="card"><div class="label">발주 목록</div><div class="result-head"><div>품목</div><div>수량</div><div>단위</div><div></div></div><div id="resultList"></div></section>
</main>
<footer class="bottom"><button class="outline" onclick="resetOrders()">초기화</button><button class="primary" onclick="copyOrders()">복사</button></footer><div class="toast" id="toast"></div>

let orders=[];const LS='voice_inventory_orders_v1';
function cleanItemName(name){return String(name||'').replace(/\((냉동|냉장|상온|실온)\)/g,'').replace(/\s+/g,' ').trim();}
function norm(s){return String(s||'').toLowerCase().replace(/\((냉동|냉장|상온|실온)\)/g,'').replace(/[^가-힣a-z0-9]/g,'');}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const ITEMS=DEFAULT_ITEMS.map((x,idx)=>({id:idx,name:cleanItemName(x.name),raw:x.name,location:x.storage||'미지정',unit:String(x.unit||'EA').toUpperCase(),key:norm(x.name)}));
function load(){try{orders=JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){orders=[];}render();}
function save(){localStorage.setItem(LS,JSON.stringify(orders));}
function parseQty(text){const m=String(text).match(/(\d+)/);return m?parseInt(m[1],10):0;}
function bestMatch(name){const key=norm(name);if(!key)return null;let best=null,score=0;for(const item of ITEMS){let s=0;if(item.key.includes(key)||key.includes(item.key))s=Math.min(item.key.length,key.length)+20;else{for(const ch of new Set(key)){if(item.key.includes(ch))s++;}}if(s>score){s=s;score=s;best=item;}}return score>=Math.max(2,Math.min(5,key.length-1))?best:null;}
function lineToOrder(line){const qty=parseQty(line);if(!qty)return {miss:line,reason:'수량 없음'};const name=line.replace(/\d+\s*(개|박스|팩|ea|box|pak)?/ig,' ').trim();const item=bestMatch(name);if(!item)return {miss:line,reason:'품목 못 찾음'};return {item,qty};}
function parseVoiceText(){const text=document.getElementById('voiceText').value;const lines=text.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean);const misses=[];for(const line of lines){const parsed=lineToOrder(line);if(parsed.item){addOrSet(parsed.item,parsed.qty);}else misses.push(parsed);}render();renderMisses(misses);toast(misses.length?'일부 항목은 확인 필요':'발주 목록에 반영했어요');}
function addOrSet(item,qty){const found=orders.find(x=>x.id===item.id);if(found)found.qty=String((parseInt(found.qty,10)||0)+qty);else orders.push({id:item.id,name:item.name,unit:item.unit,location:item.location,qty:String(qty)});save();}
function renderMisses(misses){document.getElementById('missBox').innerHTML=misses.length?'<div class="miss">확인 필요<br>'+misses.map(x=>'- '+escapeHtml(x.miss)+' ('+x.reason+')').join('<br>')+'</div>':'';}
function render(){document.getElementById('resultList').innerHTML=orders.length?orders.map((o,i)=>'<div class="row"><div><div class="name">'+escapeHtml(o.name)+'</div><div class="meta">'+escapeHtml(o.location)+'</div></div><input class="qty" inputmode="numeric" value="'+escapeHtml(o.qty)+'" oninput="updateQty('+i+',this.value)"><div class="unit">'+escapeHtml(o.unit)+'</div><button class="del" onclick="delOrder('+i+')">삭제</button></div>').join(''):'<div class="empty">아직 발주 목록이 없어요.</div>';}
function updateQty(i,v){orders[i].qty=String(v).replace(/[^0-9]/g,'');if(!orders[i].qty)orders.splice(i,1);save();render();}
function delOrder(i){orders.splice(i,1);save();render();}
function resetOrders(){if(!confirm('발주 목록을 비울까요?'))return;orders=[];save();render();toast('초기화했어요');}
async function copyOrders(){const text=orders.length?orders.map(o=>o.name+' '+o.qty+' '+o.unit).join('\n'):'입력된 발주가 없습니다.';try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}toast('복사됐어요');}
function clearText(){document.getElementById('voiceText').value='';document.getElementById('missBox').innerHTML='';}
function appendExample(){document.getElementById('voiceText').value='원팩딸기 3개\n우유 2개\n로투스 1박스';}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('이 브라우저는 앱 음성인식을 지원하지 않아요');document.getElementById('voiceText').focus();return;}const r=new SR();r.lang='ko-KR';r.interimResults=false;r.continuous=false;r.onresult=e=>{const t=e.results[0][0].transcript;const box=document.getElementById('voiceText');box.value+=(box.value?'\n':'')+t;toast('받아썼어요');};r.onerror=()=>toast('음성 인식이 중단됐어요');r.start();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1800);}
load();
